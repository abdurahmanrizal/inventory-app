<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10233f" />
    <title>Offline - BAS StockFlow</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 36px;
        text-align: center;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: white;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 22px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
      }
      button {
        margin-top: 24px;
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: #059669;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/bas-stockflow-mark.png" alt="BAS StockFlow" />
      <h1>Anda sedang offline</h1>
      <p>
        Koneksi internet diperlukan untuk memastikan data stok dan approval
        tetap akurat. Sambungkan perangkat lalu coba kembali.
      </p>
      <button type="button" onclick="window.location.reload()">
        Coba kembali
      </button>
    </main>
  </body>
</html>
